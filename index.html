<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#050510" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>烟花爱心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sky" aria-label="烟花动画"></canvas>
  <audio id="bgm" loop preload="auto">
    <source src="love.mp3" type="audio/mpeg" />
  </audio>
  <button type="button" class="music-btn" id="musicBtn" aria-label="播放音乐">
    <svg class="music-btn__icon music-btn__icon--play" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 5.5v13l11-6.5z" fill="currentColor" />
    </svg>
    <svg class="music-btn__icon music-btn__icon--pause" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7 6h3v12H7zm7 0h3v12h-3z" fill="currentColor" />
    </svg>
  </button>
  <div class="message" id="message">
    <p class="message__line">我爱你</p>
    <p class="message__sub">胡盼芬💗何俊峰</p>
  </div>
  <script src="fireworks.js"></script>
</body>
</html>
